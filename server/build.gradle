plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.1'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.wildfirespot'
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform { excludeTags "point-cloud-e2e" }
}

sourceSets.test.resources.srcDir('../tests/fixtures')


tasks.register('pointCloudE2e', Test) {
    description = 'Runs the hardware-free C++/Python/Spring/browser point cloud pipeline.'
    group = 'verification'
    ignoreFailures = false
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'point-cloud-e2e' }
    doNotTrackState('The pipeline exercises external processes and sources outside the server project.')
    timeout = java.time.Duration.ofSeconds(420)
    systemProperty 'pointCloud.repository', rootDir.parentFile.canonicalPath
    doFirst {
        ['UNITREE_LIDAR_SDK_ROOT', 'POINT_CLOUD_TEST_PYTHON', 'POINT_CLOUD_TEST_NODE',
         'POINT_CLOUD_PLAYWRIGHT_MODULE', 'POINT_CLOUD_CHROME'].each { name ->
            if (!System.getenv(name)) throw new GradleException("Missing required E2E environment variable: ${name}")
        }
    }
    afterSuite { descriptor, result ->
        if (!descriptor.parent && (result.testCount < 1 || result.skippedTestCount != 0)) {
            throw new GradleException('Point cloud E2E requires at least one test and zero skipped tests; failures are enforced by ignoreFailures=false.')
        }
    }
    testLogging { events 'passed', 'failed', 'skipped'; showStandardStreams = true; exceptionFormat = 'full' }
}
